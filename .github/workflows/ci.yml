name: Package CI

on:
  push:
    branches: [ "main", "master", "fix/*" ]
  pull_request:
    branches: [ "main", "master", "fix/*" ]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        laravel: ['10.*', '11.*', '12.*']
        include:
          - laravel: '10.*'
            testbench: '^8.0'
          - laravel: '11.*'
            testbench: '^9.0'
          - laravel: '12.*'
            testbench: '^10.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pdo, sqlite, pdo_sqlite, json, fileinfo, curl
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Select framework version
        run: |
          composer require "orchestra/testbench:${{ matrix.testbench }}" "illuminate/support:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" "illuminate/database:${{ matrix.laravel }}" "illuminate/console:${{ matrix.laravel }}" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Composer Audit
        run: composer audit

      - name: Run static analysis (PHPStan / Larastan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run test suite
        run: vendor/bin/phpunit
