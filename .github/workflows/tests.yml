name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        laravel: ['10', '11', '12']
        include:
          - laravel: '10'
            testbench: '^8.0'
          - laravel: '11'
            testbench: '^9.0'
          - laravel: '12'
            testbench: '^10.0'
        # Every combination in this matrix resolves: Laravel 12 requires
        # PHP >= 8.2, which both matrix PHP versions satisfy; Laravel 10 also
        # runs on PHP 8.3. No `exclude` entries are therefore required. If a
        # PHP 8.1 row were added later, `laravel: '12'` x `php: '8.1'` would
        # have to be excluded here.
        exclude: []

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, json, mbstring
          coverage: none

      - name: Pin the Laravel / Testbench version for this matrix row
        run: >
          composer require --no-interaction --no-update
          "laravel/framework:^${{ matrix.laravel }}.0"
          "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Run the test suite (the `live` group is excluded in phpunit.xml)
        run: php vendor/bin/phpunit
